# Publishes the app on every push to main (or manually: Actions → Deploy → Run workflow).
#
# Setup:
#   1. Fill in the TODO values in .env.production (public settings, safe to commit).
#   2. GitHub → Settings → Secrets and variables → Actions → Secrets:
#        FIREBASE_SERVICE_ACCOUNT  – contents of the Firebase service-account .json
#        SUPABASE_ACCESS_TOKEN     – supabase.com → Account → Access Tokens
#   3. Same page → Variables:  DEPLOY_ENABLED = true
# Live URL: https://<VITE_FIREBASE_PROJECT_ID>.web.app
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Read settings from .env.production
        run: |
          if grep -q '=TODO' .env.production; then
            echo "::error::.env.production still has TODO values – fill them in first."; exit 1
          fi
          grep -E '^(VITE_FIREBASE_PROJECT_ID|VITE_BOOTSTRAP_ADMIN_EMAIL|SUPABASE_PROJECT_REF)=' .env.production >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm test

      - name: Set the bootstrap admin in Firestore rules
        run: sed -i "s/'you@gmail.com'/'${VITE_BOOTSTRAP_ADMIN_EMAIL}'/" firestore.rules

      - name: Build
        run: npm run build

      - name: Deploy Firebase Hosting + Firestore rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore:rules,firestore:indexes --project "$VITE_FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy Supabase Edge Functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          P="$VITE_FIREBASE_PROJECT_ID"
          # FCM_SERVICE_ACCOUNT lets the notify function send push notifications
          # (base64 so the JSON survives as one value; never printed).
          FCM_B64="$(printf '%s' "$SA_JSON" | base64 -w0)"
          echo "::add-mask::$FCM_B64"
          npx -y supabase@2 secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            FIREBASE_PROJECT_ID="$P" TRIP_ID=main APP_URL="https://$P.web.app" \
            ALLOWED_ORIGINS="https://$P.web.app,https://$P.firebaseapp.com,http://localhost:5173" \
            FCM_SERVICE_ACCOUNT="$FCM_B64"
          npx -y supabase@2 functions deploy files --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          npx -y supabase@2 functions deploy notify --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Live URL
        run: echo "### ✅ App is live at https://${VITE_FIREBASE_PROJECT_ID}.web.app" >> "$GITHUB_STEP_SUMMARY"
